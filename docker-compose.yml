services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: website_backend_app
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    restart: unless-stopped
    working_dir: /var/www
    environment:
      COMPOSER_HOME: /tmp/composer
    volumes:
      - ./:/var/www
    command: >-
      sh -ec 'composer install --no-interaction --prefer-dist
      && exec php-fpm'
    networks:
      - website_backend_network
    depends_on:
      - mysql
      - redis

  nginx:
    image: nginx:alpine
    container_name: website_backend_nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - website_backend_network
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    container_name: website_backend_mysql
    restart: unless-stopped
    ports:
      - "127.0.0.1:3308:3306"
    environment:
      MYSQL_DATABASE: website_backend
      MYSQL_ROOT_PASSWORD: rootsecret
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - website_backend_network

  redis:
    image: redis:alpine
    container_name: website_backend_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - website_backend_network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: website_backend_phpmyadmin
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: laravel
      PMA_PASSWORD: secret
    networks:
      - website_backend_network
    depends_on:
      - mysql

networks:
  website_backend_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
